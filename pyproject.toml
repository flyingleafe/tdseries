[project]
name = "tdseries"
version = "0.2.0"
description = "Immutable pytree frames of tensors with named, indexed dimensions — time as a first-class tick-exact dimension"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitrii Mukhutdinov", email = "flyingleafe@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "array-api-compat>=1.9",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "torch>=2.0",
    "jax>=0.4.28",
]

[tool.uv.sources]
# Dev/CI only need torch for type-checking + tests, not GPU kernels; pin to
# the CPU-only wheel index so `uv sync` doesn't pull the CUDA/nvidia stack
# (several GB). Downstream users of the `torch` extra are unaffected --
# this source override is local to this workspace's lockfile.
torch = [
    { index = "pytorch-cpu", marker = "platform_system != 'Darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdseries"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
